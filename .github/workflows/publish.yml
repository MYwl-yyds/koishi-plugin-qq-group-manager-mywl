# .github/workflows/publish.yml
name: Publish

on:
  push:
    branches: [master, main]   # 推送到 master 或 main 分支时触发
  workflow_dispatch:           # 也可以从 GitHub 页面手动触发

permissions:
  contents: write
  id-token: write              # OIDC 发布必须的权限

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Publish to npm
        run: npm publish --access public --provenance